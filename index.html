<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>NameSilo — URL maps</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --tertiary: #86868b;
    --separator: rgba(0,0,0,0.08);
    --accent: #0071e3;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 560px at 10% -10%, rgba(180,210,245,0.42), transparent 60%),
      radial-gradient(900px 500px at 95% 0%, rgba(230,230,235,0.7), transparent 55%),
      linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 40%, #f5f5f7 100%);
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 72px 28px 96px;
  }
  .brand {
    font-size: clamp(40px, 7vw, 64px);
    font-weight: 700;
    letter-spacing: -0.038em;
    line-height: 1;
    margin: 0 0 18px;
  }
  h1 {
    font-size: clamp(22px, 3.2vw, 32px);
    font-weight: 600;
    letter-spacing: -0.028em;
    line-height: 1.15;
    margin: 0 0 12px;
  }
  .support {
    font-size: 18px;
    color: var(--secondary);
    margin: 0 0 40px;
    max-width: 36em;
    letter-spacing: -0.012em;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--separator);
  }
  a.map {
    display: block;
    padding: 28px 0;
    text-decoration: none;
    color: inherit;
    border-bottom: 1px solid var(--separator);
    transition: opacity 0.2s ease;
  }
  a.map:hover { opacity: 0.72; }
  a.map .label {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.022em;
    margin: 0 0 6px;
    color: var(--accent);
  }
  a.map .desc {
    font-size: 15px;
    color: var(--tertiary);
    margin: 0;
    line-height: 1.45;
  }
</style>
</head>
<body>
<main>
  <p class="brand">NameSilo</p>
  <h1>URL maps</h1>
  <p class="support">Choose a map — open in the browser for the full interactive view.</p>
  <div class="links">
    <a class="map" href="url-seo-file-map.html">
      <p class="label">URL → SEO files</p>
      <p class="desc">For each English URL, which SEO files apply (page.md, JSON, JSON-LD).</p>
    </a>
    <a class="map" href="url-migration-map.html">
      <p class="label">URL migration</p>
      <p class="desc">Old addresses to new permanent paths, grouped by topic.</p>
    </a>
  </div>
</main>
</body>
</html>
